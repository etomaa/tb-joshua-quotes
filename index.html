  {id:128,text:"God allows everything to take place at their appointed time and season. We may not understand it, but it is this that constitutes the beauty in creation."},
  {id:129,text:"When you humble yourself for Christ's sake, He will exalt you in His own time and season."},
  {id:130,text:"When you are so tired and sick of the world, you are ready to embrace the superior order of Christ."},
  {id:131,text:"Miracles are wrought in the name of Jesus, not by repeating the name as a charm but by believing it as a divine revelation of grace and goodwill to men."},
  {id:132,text:"Your capacity to believe must be strong enough to attract and accommodate all rights and privileges in Christ."},
  {id:133,text:"If you have a strong capacity to believe, anything you do in the name of Jesus is done by Jesus Himself."},

  {id:135,text:"If you realise your capacity to believe is not enough, you can offer prayers of faith for it and Jesus will enlarge your spiritual coasts."},
  {id:136,text:"Looking the other way when your brother is in trouble is equal to rejecting Christ Himself."},
  {id:137,text:"We serve God when we help our fellow brother."},
  {id:138,text:"Our position in Christ Jesus is enhanced each time we help someone in trouble."},

  {id:141,text:"Man cannot discover new oceans if he does not lose sight of the shore."},
  {id:142,text:"Believe in your dream! When you believe in your dream, you become a man of vision."},
  {id:143,text:"If you are a man of vision, no matter what constitutes the obstacles on your way, you can never be stopped. Instead of pressure and tension reducing your vision, it will even enlarge your strategies."},
  {id:144,text:"When you know your real value, your enemies may try to strip you of outward prestige and beauty but they cannot take from you the wisdom and grace of God."},
  {id:145,text:"God is more concerned with our future than He is about our present state."},
  {id:146,text:"What you are feeling now is as a result of your focus."},
  {id:147,text:"The person that folds his hands will not have any record."},
  {id:148,text:"Worrying about the future destroys our sense of judgement."},
  {id:149,text:"The cause of killing, stealing and destruction is the urge to store up treasures here on earth."},
  {id:150,text:"If you give your attention to God, you are what God says you are, you can do what God says you can do, you have what God says you have."},
  {id:151,text:"Life is a battlefield and the sooner you understand this, the wiser you will be."},
  {id:152,text:"Afflictions are meant for our spiritual benefit so that we may learn to pray the more."},
  {id:153,text:"Pride is a sin in us by nature; we must be cautioned and armed against it."},
  {id:154,text:"If an answer is not given for the first prayer nor to the second, we must hold on and hold out till we receive an answer."},
  {id:155,text:"Warfare is necessary for your victory."},
  {id:156,text:"Abel gave in faith. I mean he gave with an eye to God's will, honour and glory. Cain gave to honour himself and dishonour God, and so it turned to sin against him."},
  {id:157,text:"Abel used his substance to demonstrate the state of his mind as a penitent soul while Cain was arrogant and unrepentant."},
  {id:158,text:"It is common for those who have rendered themselves unworthy of God's favour to have hatred against those who God favours."},
  {id:159,text:"Giving offers us the opportunity to reshape our destiny. When you give, you are reshaping your destiny."},
  {id:160,text:"When God is honoured in our offering, whether we die or live, it does not matter. When God is dishonoured in our offering, we are doomed."},
  {id:161,text:"A true Christian should see giving as an assignment from God."},
  {id:162,text:"When we give, it makes us like unto God, who gives to all and receives from none."},
  {id:163,text:"Until we begin to accept the differences in our personalities, we cannot move forward."},
  {id:164,text:"He who finds it difficult to forgive fails to understand the absolute truthfulness of God's Word which says in Romans 3:23 \"All have sinned and fallen short of the glory of God\"."},
  {id:165,text:"Forgiveness does not mean ignoring what has happened. It does not mean that you sweep the dirt under the rug. Forgiveness is an awareness that no one is perfect."},
  {id:166,text:"The fact that we disagree on a certain issue should not break our union or our friendship because there is always a way out in Christ Jesus."},
  {id:167,text:"To come to a place of reconciliation, you must first discover your weakness and when you do, you will discover that you need to forgive because you need to be forgiven."},
  {id:168,text:"Joshua's consistency and obedience to God's instruction are a challenge to all Christians today, especially the busy elites of the www.com."},
  {id:169,text:"As Christians, our key responsibility in life is to trust the Holy Spirit, to keep His Word in our mouth, in our heart and in every conversation."},
  {id:170,text:"Today, everyone desires breakthrough, whereas disappointment most times serves to keep us for a new level in life."},
  {id:171,text:"The principle of life says that nothing happens for nothing; nothing comes by chance. If you understand this principle, you will always reflect on life itself, rather than the situation you are in."},
  {id:172,text:"God delivers His faithful servants out of trouble and puts honour upon them and He is not far from those who worship Him in truth and in faith."},
  {id:173,text:"There is something far more important than your situation. Beyond your situation lies God's purpose for your life."},
  {id:174,text:"God wants you to succeed but He wants you to succeed with a purpose."},
  {id:175,text:"When we are sick and tired of our worldly business and frustrated in our worldly affairs, we are welcome to Christ."},
  {id:176,text:"You have been given a good destiny but destiny can be changed when you don't know where you are destined to be."},
  {id:177,text:"As Jesus said to Peter, He says to you, \"If you have ever confessed failure before, stop confessing failure from today because I am here to support your position.\""},
  {id:178,text:"Our confession governs our faith."},
  {id:179,text:"Confession builds the road over which faith carries its mighty cargo."},
  {id:180,text:"You think right when, by an act of faith, you begin to think not of your limitations or shortcomings but of your righteousness in Christ Jesus."},
  {id:181,text:"The conscience is God's instrument for discernment."},

  {id:183,text:"God cannot work miracles through you except by your capacity to believe."},
  {id:184,text:"Faith grows spontaneously the moment you realise that God is reliable."},
  {id:185,text:"It is better not to receive something you cannot maintain because it will expose you and put you in the hands of enemies."},

  {id:188,text:"Engage your heart with the Word of God you have read attentively, slowly and repeatedly and it will begin to influence your conduct and character."},

  {id:191,text:"We resist the devil by not becoming offended."},
  {id:192,text:"You will receive in a moment what you have been seeking for years, the moment you let go of your offence."},

  {id:194,text:"If we fail to see that there are powers that cause one to be bowed down in bondage, we will fight the wrong battle."},
  {id:195,text:"Our battle is not against flesh and blood but principalities and powers that cause tension and pressure in our lives."},
  {id:196,text:"Until a person is willing to admit that he is a sinner in need of salvation, he cannot experience freedom from guilt, fear, inferiority and condemnation, which are four major problems that rob Christians of their blessings."},
  {id:197,text:"Satan uses our weakness or limitation as a bait to trap us from running a straight race with God."},
  {id:198,text:"God is always ready to readmit His people, who come to Him in humility and repentance, to the right position in His glory."},
  {id:199,text:"What it takes gold to be gold is what it takes you to be a Christian."},
  {id:200,text:"There are some challenges caused by yourself and when you cause it, God will withdraw His strength."},
  {id:201,text:"If you have not engaged your heart with God's Word, you would murmur and rebel when challenges come, instead of finding out what God has to say about those challenges."},
  {id:202,text:"We are good at sending our prayers up to God but we are not good at sitting back in faith to hear what God has to say about our situation."},
  {id:203,text:"When you stay in faith in Christ Jesus, that is when you can hear God's voice most clearly."},
  {id:204,text:"Jesus Christ did not come for the righteous but to seek for the unrighteous and bring them to the righteousness of God."},
  {id:205,text:"Forgiveness is a bridge to where God dwells. Correction carries us to that place. It is a place of good success, a place of peace and comfort."},
  {id:206,text:"The harbouring of the spirit of unforgiveness breaks our communion with God."},
  {id:207,text:"He who does not forgive cannot be entrusted with the power to heal, to bless, to overcome."},
  {id:208,text:"Dirty as you may be, Jesus can still cleanse you."},
  {id:209,text:"When we examine our daily life, we will find out how much faith we have."},
  {id:210,text:"Faith is manifested in the small things in our daily life."},

  {id:212,text:"Big situations happen occasionally but little situations happen all the time."},
  {id:213,text:"Faith is there for our challenges. It must be confessed with the mouth, worked out in action and tested by tribulation."},
  {id:214,text:"Some people see trials, tribulations or challenges as poison that kills one's happiness, desire and zeal to move forward in life but to people of God, trials, tribulations or challenges are a tonic to their spiritual growth; they are a driving force to a higher aspiration in life."},
  {id:215,text:"Sometimes, if we go too far as a result of pride and arrogance, the Lord may permit poverty, sickness, setback or any foolish thing in order to keep us from losing our salvation."},
  {id:216,text:"When you run away from trouble, you run away from solution, success and breakthrough."},
  {id:217,text:"When you are in a place where God wants you to be, satan would want to offend you to pull out."},
  {id:218,text:"The beauty of our Christian journey is the trials, temptations, difficulties and challenges we encounter on our way to redemption."},
  {id:219,text:"Your present situation, no matter how hard it is, is meant for your spiritual benefit."},
  {id:220,text:"When we talk of challenges, knowledge is not the key; obedience is."},
  {id:221,text:"Challenges determine where you are spiritually."},
  {id:222,text:"Challenges reveal the true condition of man's heart."},
  {id:223,text:"Physical growth is a function of time; academic growth is a function of learning, whereas spiritual growth is the function of obedience to the will of God."},
  {id:224,text:"Jesus learned obedience by the things He suffered. We learn obedience by the difficulties and challenges we face today."},
  {id:225,text:"People who are seeking experiences always walk by the senses, which are temporal and have no lasting value."},
  {id:226,text:"Man continues to search for outer beauty, splendour and prestige yet all that glitters is not gold."},
  {id:227,text:"A man is what he thinks about all day long; the level of the thoughts of your heart determines your life."},
  {id:228,text:"As Christians our heart must be active, strong and alert; if not, the enemy of our soul will take hold of it and begin to manipulate our thoughts."},
  {id:229,text:"A genuine spiritual experience needs to be tested in the face of the real situation in order to expose the reality of the experience."},
  {id:230,text:"When you are facing the uncertainties of life, do not think that God has abandoned you but look first to the Cross, where the price was paid for the wisdom and knowledge you need to handle such a situation."},
  {id:231,text:"As a genuine believer, failure, poverty, embarrassment, imprisonment can humiliate you but cannot destroy you."},
  {id:232,text:"As a Christian, when you pray, the answer you receive depends on how God chooses to implement His will in that situation."},
  {id:233,text:"When you handle your situation with care, someone in the palace will call for you just as Pharaoh called for Joseph."},
  {id:234,text:"The hour of Christ's death was the beginning of His glorification and our redemption."},
  {id:235,text:"The hour of your trial marks the dawn of your testimony."},
  {id:236,text:"You must be willing to go through a season of pain in order to create an eternity of gain."},
  {id:237,text:"Sometimes we must do things we hate in order to create something we love."},
  {id:238,text:"Jesus had confidence in His own resurrection and that enabled Him to endure His crucifixion."},
  {id:239,text:"When you know the purpose of your situation, your fear of that situation vanishes."},
  {id:240,text:"Do you feel as if life has cheated on you? If you do, look in faith to Jesus. He was unjustly nailed to a cross so you could be forgiven of your sin and have a life that is fulfilling."},
  {id:241,text:"Let us leave tomorrow's troubles for the One who bore our troubles on the Cross."},
  {id:242,text:"As Christians, whenever we are tempted, we should always remember that our foundation, defence or answer is quite simple: the written and eternal Word of God."},
  {id:243,text:"The first place to be victorious is in our spiritual life and in our mind because victory does not start around us; it begins within us."},
  {id:244,text:"The management of our heart and its thoughts is fundamental to our faith and holy living."},
  {id:245,text:"When we learn to use the name Jesus Christ according to the Word of God in the power of the Holy Spirit, we will have the secret that shook the whole world through the Apostles."},
  {id:246,text:"When God is involved in your battle, your victory is assured because the extent of His care and the strength of His might in our lives weaken and frustrate our adversaries."},
  {id:247,text:"The lifestyle God expects from us as Christians is a lifestyle of positive faith; I mean positive thinking, positive talking and positive acting."},
  {id:248,text:"Trouble and affliction serve in moving us closer to God."},
  {id:249,text:"As a Christian, your condition or situation does not affect your relationship with God."},
  {id:250,text:"What you say will become a visible reality in the natural world if you steadfastly hold on to your confession of faith."},
  {id:251,text:"Beyond your present situation is revival, renewal and redemption."},
  {id:252,text:"The choices we make determine whether we are children of God or children of satan."},
  {id:253,text:"An excuse is a reason, whether genuine or fake, which we give to explain or to defend our wrongdoing."},
  {id:254,text:"All men fall but great men get back up."},
  {id:255,text:"If the curse of imperfection hits, it is our responsibility to confess to God and receive His mercy, learn from it and keep on growing."},
  {id:256,text:"It is not that children of God do not wrong but when they do, the guilt of that action would not allow them to have peace of mind until they ask for and obtain forgiveness."},
  {id:257,text:"When we sin or attempt to do so, the Holy Spirit prompts our conscience to accuse us to repentance."},
  {id:258,text:"Instead of allowing our sin to drive us from His presence, it should be the reason for coming closer to Him."},
  {id:259,text:"We should not allow the guilt of our sin to rob us of the peace we would receive in Christ's pardon."},
  {id:260,text:"Pardon puts peace in the heart of the one who truly repents."},
  {id:261,text:"Disappointment sometimes serves to keep us for a new level in life."},
  {id:262,text:"Be patient; God's response is not for those in a hurry."},
  {id:263,text:"When trouble comes to the man or woman of faith, there is always a future but to a man or woman without faith, the end has come."},
  {id:264,text:"As a man of faith, you must find ways of building bridges which close the gap from where you are to your destination."},
  {id:265,text:"Look beyond your situation because the thing that keeps us from despairing is not what we see but what we believe."},
  {id:266,text:"When we plant wrong seeds a wrong harvest will come."},
  {id:267,text:"You take a step back when you start complaining."},
  {id:268,text:"When you have a challenge and that challenge causes you to depend on God, this means your challenges are meant for promotion."},
  {id:269,text:"No matter your past, life does not completely close the door to opportunity."},
  {id:270,text:"Stop combining where you are coming from with where you are going."},
  {id:271,text:"There are two sources of greatness in this world: God and satan. To be great born of God is to derive your resources from God, while to be great born of satan is to derive your resources from satan."},
  {id:272,text:"When God is the source of your strength, no one can be against you."},
  {id:273,text:"Satan always uses your situation. This is why we should not be misled by our situation."},
  {id:274,text:"Many people today, in their attempt to beat God's appointed time, they have setbacks, others have setdowns and many others pay with their dear life."},
  {id:275,text:"Those who fail to take these tiny steps cannot trust God and understand the basic truth about faith."},
  {id:276,text:"Unforgiveness due to offence is one of the traps satan, the enemy of our souls, uses to hold us in bondage."},
  {id:277,text:"When we get offended, we hardly realise that we are trapped."},
  {id:278,text:"Offence itself is not deadly but harbouring or keeping it in our heart makes it deadly."},
  {id:279,text:"Holding an offence against someone hinders and handicaps us from fulfilling our full potential."},
  {id:280,text:"When you forgive and let go of offence, something will happen to you that cannot be explained by the natural mind."},
  {id:281,text:"Man is a spirit, has a soul and lives in a body."},
  {id:282,text:"As long as we live, we will continue to be confronted by situations that are not consistent with God's Word because we are a spirit learning to live in the natural world."},
  {id:283,text:"When we are led by our intellect, feelings and emotions, we may confess faith in the Word but keep denying it in action."},
  {id:284,text:"The best antidote against the poison of sin is to walk in the Spirit."},
  {id:285,text:"God's Word has the ability to quicken us spiritually and helps our spirit govern our senses."},
  {id:286,text:"When God, the Almighty comes to enquire for true believers, the question will not be, “Who can read and quote the Bible from Genesis to Revelation?” but, “Who hears, believes and obeys God's Word?”"},
  {id:287,text:"It is the doer of the Word that receives things from God."},
  {id:288,text:"A humble believing soul takes all that Jesus says and does in good faith and puts the best construction on it."},
  {id:289,text:"God always rewards the obedient. He does not necessarily reward good, smart or wealthy people; He rewards the obedient."},
  {id:290,text:"God is in all ages, revealing Himself through a generation of true believers."},
  {id:291,text:"If you do not see yourself the way God sees you, you will not see your real value. And if you do not see your real value, you will not be able to fulfil the purpose which God has created you for."},
  {id:292,text:"To a man of vision, no matter what happens, no matter what comes, there is always a future."},
  {id:293,text:"When you know your real value, your enemies may rob you of liberty and confine you in a prison cell but they cannot shut you out of the throne of mercy and communion with God."},
  {id:294,text:"Make the most of life because life is too short to waste time on things that have no lasting value."},
  {id:295,text:"Your conscience is the very instrument used to guide you by the Holy Spirit."},
  {id:296,text:"If you ignore your conscience when you pray, you are wasting your time."},
  {id:297,text:"If you don't want trials, you don't want success in life."},
  {id:298,text:"The bigger your success, the bigger your enemy."},
  {id:299,text:"When offence comes, you lose control and you start doing the work of satan."},
  {id:300,text:"When you are holding offences such as bitterness, anger, hatred, pain of the past and so forth, you are building a wall."},
  {id:301,text:"When you begin to take responsibility for your problem, you will begin to think of what you can do to get out of it."},
  {id:302,text:"God's Word is the seed of divine life that comes into our hearts and causes faith to grow."},
  {id:303,text:"Faith exists at 3 levels:"},
  {id:304,text:"When we take Jesus Christ at His Word, we will see the same results the early disciples saw."},
  {id:305,text:"Acting on the Word of God makes Jesus Christ truly real to the believer."},
  {id:306,text:"No state of being is as rewarding as living in tune with God."},
  {id:307,text:"Resurrection, according to the 27th and 28th chapters of Matthew is a process, just as everything in life: Crucifixion, Death, Burial and Resurrection."},
  {id:308,text:"HIS CRUCIFIXION: In Isaiah 53:5, the Bible says that He was flogged, tortured, humiliated and dehumanised before He was brutally murdered. But He responded with forgiveness, saying, “Father forgive them,” knowing that His death would accomplish salvation for mankind – that is for you and me."},
  {id:309,text:"HIS DEATH: In Proverbs 21:18, by divine providence it was predestined that the wicked are a ransom for the righteous, the unjust for the just, the transgressors for the divine grace. But in this case of an unparalleled instance of divine grace, Jesus, the righteous was a ransom for the wicked."},
  {id:310,text:"HIS BURIAL: Christ was buried so that His rejection could be complete."},
  {id:311,text:"HIS RESURRECTION: In Romans 1:3–4, the Bible says that Jesus Christ was declared to be the Son of God with power according to the Spirit of holiness – by His resurrection from the dead."},
  {id:312,text:"His resurrection is the joy of His friends and the terror and confusion of His adversaries."},
  {id:313,text:"No one can succeed alone. We depend on others to succeed in our respective callings."},
  {id:314,text:"As children of God, our union with Christ is the basis of our unity with one another."},
  {id:315,text:"Challenges force us to look deep inward and come up with the result that no one knows us more than ourselves."},
  {id:316,text:"Our relationship with God depends, far more than we think, upon our adjustment to one another."},
  {id:317,text:"To improve in your relationships learn to give people another chance."},
  {id:318,text:"Adopting a life-style that is on purpose provides an opportunity to enrich others by leaving your imprint in a positive way."},
  {id:319,text:"The better a man is, the worse he is thought of by his rivals."},
  {id:320,text:"Your enemies may call you names in order to paint you black in the eyes of people, but the wisdom and the grace of God cannot be taken from you."},
  {id:321,text:"The rich should not concentrate on their wealth; the poor should not concentrate on their poverty; the sick should not concentrate on their sickness, if they want to serve God in truth and faith."},
  {id:322,text:"The greatest thing satan aims at in tempting good people is to overthrow their position as children of God, cut off their dependence on God, their duty to God and their communion with God."},
  {id:323,text:"You should not because of your situation cut off your dependence on God."},
  {id:324,text:"No matter what you are passing through, if it is allowed by God as a trial, you must not think it strange and doubt your Guard."},
  {id:325,text:"Unfortunately, many today have surrendered to their fears while their hearts dream of a miracle."},
  {id:326,text:"Our focus as Christians should be only on what God has to say about our situation, not what our natural circumstances have to say."},
  {id:327,text:"Whatever situation you are in as a Christian, never for a moment acknowledge that God's ability cannot put you over."},
  {id:328,text:"Jesus' temptation shows that He was not out for material and political gains but for the work of His Heavenly Father."},
  {id:329,text:"If you are not out for material and political gains but to do God's work, you will overcome your temptation."},
  {id:330,text:"When we presume upon our own power and tempt satan to tempt us, we provoke God to withdraw His power and leave us to our own power."},
  {id:331,text:"If you go out of your way or duty because of the problem you have, you forfeit the promise and put yourself out of God's protection."},
  {id:332,text:"People will challenge you, question you, try to get you off track. Do not yield to the temptation to act out of character."},
  {id:333,text:"What you will become tomorrow depends on the choices you make today."},

  {id:335,text:"Satan aims to check our faith in the Word of God and to make us question the truth in the Word of God."},
  {id:336,text:"If you want to be successful in life, do not look back; it is a dangerous thing to do unless it is meant to glorify God Almighty for what He has done in your life."},
  {id:337,text:"Don't let your bad experiences wipe you out. Turn your scars into stars."},
  {id:338,text:"Satisfaction in life is not about having children, money or other worldly possessions. You have to experience God."},
  {id:339,text:"If you are focused only on making money, a large slice of life will pass you by."},
  {id:340,text:"When your purpose in life is clear, your life will have meaning."},
  {id:341,text:"Many today have changed the course of the history of their lives by taking shortcuts."},
  {id:342,text:"Those who see God as one of those things – money, business, social relations, pleasures, comfort, art or societal status – can affect their relationship with God."},
  {id:343,text:"To a man of faith whose focus is on God Almighty, every trouble is designed to advance his cause in his spiritual walk with the Lord."},
  {id:344,text:"As genuine believers, when our troubles seem unyielding in spite of our prayers, fasting and struggles, it is in our own interests to get above our fears, anxiety and worries by leaving it to God Almighty."},
  {id:345,text:"When you are doing something through God, He will continue to speak strength and courage through trials."},
  {id:346,text:"The first step in knowing your calling is to get to know God better by reading His Word."},
  {id:347,text:"When you let God transform you by the power of His Holy Spirit, He will literally begin to show you the way."},
  {id:348,text:"God's Word is the tool in the hands of the Holy Spirit to nurture us and to furnish us with everything we need to succeed on earth."},
  {id:349,text:"The Word of God must become your database for your personal opinion."},
  {id:350,text:"Everyone who walks by faith will have testing."},
  {id:351,text:"Your present situation is meant for your spiritual benefit."},
  {id:352,text:"Faith focuses on Jesus Christ instead of our problems."},

  {id:355,text:"He who desires triumph or victory must be ready to embrace war because triumph or victory is a product of warfare."},
  {id:356,text:"Satan is a tempter; he uses our situation to tempt us in order to distract us from running the straight race with God."},
  {id:357,text:"As a child of God, don't be ruled by your situation because your relationship with God is based on nothing else but God."},
  {id:358,text:"To know the truth, our knowledge of the Holy Bible must be broad and holistic."},
  {id:359,text:"The living Word is not in the book nor is it on the written page. The living Word is in the lips of the believers."},
  {id:360,text:"God is in all ages gathering into Himself a generation of spiritual worshippers."},
  {id:361,text:"We are called to God's kind of lifestyle. This is a lifestyle of positive thinking, positive talking and positive acting."},
  {id:362,text:"Jesus is the Word by whom God speaks to us today. I am in It, you are in It and most importantly, God is in It. Here, you meet God face to face."},
  {id:363,text:"When we know the Word is God speaking to us, it will not be difficult for us to obey It; it will not be difficult for us to act upon It."},
  {id:364,text:"Man's judgement is based only on what is seen, heard and on what the circumstances look like. This kind of judgement is limited and cannot understand God."},
  {id:365,text:"When you base your judgement only on what is seen, heard and on what the circumstances look like, you have not looked deep enough to the heart."},
  {id:366,text:"If you have decided to make Jesus Christ your source and your protector, get ready for trial."},
  {id:367,text:"Trials and temptations are the soil in which the man of faith flourishes."},
  {id:368,text:"Each time God comes with a huge blessing for you, the first sign you will see is that you will receive attack."},
  {id:369,text:"Christ's kind of belief is the transformative power of the universe; the power of change from what you are to what you want to be."},
  {id:370,text:"It is time to dream again! I mean, it is time to plan greater plans because the secret of tomorrow's success lies in the plans of your daily routine."},
  {id:371,text:"God often humbles those He designs to exalt and makes them the stone the builders reject which finally becomes the head cornerstone."},
  {id:372,text:"When you are persecuted for what you believe in, count it all joy that your chance of victory is at hand."},
  {id:373,text:"Being misjudged is the last stage before supernatural promotion."},
  {id:374,text:"Life is in stages: a time to be born; a time to grow; a time to face persecution; a time to overcome and a time to show the proceeds of victory."},
  {id:375,text:"Jesus knows how undeserving of His grace we are; that is why He has decided to brush aside our past in order to determine our future."},
  {id:376,text:"The membership of our local Church is merely symbolic. What matters is Christ in you, the hope of glory."},
  {id:377,text:"It is by looking forward that you discover new things, new horizons and new opportunities you would not have ordinarily dreamed of."},
  {id:378,text:"If you are to solve today's problems, using the approach of yesterday, you would not make a difference."},
  {id:379,text:"Unless you change your attitude, character and general approach to life, you would find yourself looking forward to a fresh beginning at the end of the year."},
  {id:380,text:"Human rebellion makes us do things against God's instruction."},
  {id:381,text:"It is not a mere wishful thinking that brings about contented life but a rightful focus."},
  {id:382,text:"Those who have been delivered by Christ's Word must be ruled by His Word."},
  {id:383,text:"When your spirit loses its sensitivity, your real value is at stake; it becomes a tool in the hand of the devil, a toy for manipulation."},
  {id:384,text:"Serving God is to do what the best do."},
  {id:385,text:"You are included in God's master plan but nothing great comes easy."},
  {id:386,text:"Hard times can touch you but they cannot destroy you as a Christian."},
  {id:387,text:"Successful people did not just drift to the top. It takes focused action, personal discipline and a lot of energy every day to make things happen."},
  {id:388,text:"A true Christian is tested by his ability to face circumstances."},
  {id:389,text:"Trials and tests promote and advance your course."},
  {id:390,text:"Jesus loves those who are able to exercise great faith under great trials and temptation."},
  {id:391,text:"Anointing does not work through plans, methods or machinery but through suitable men."},
  {id:392,text:"Eloquence, friendliness or ability to inspire does not make you suitable; honouring Jesus with your character does."},
  {id:393,text:"As physical growth is a function of time, intellectual growth is a function of learning and spiritual growth is a function of obedience."},
  {id:394,text:"We grow in character through our obedience to God."},
  {id:395,text:"Difficulties, challenges and seemingly impossible situations can be our greatest friends. They are an opportunity to run to God."},
  {id:396,text:"As a believer, it is your relationship with God your Father that makes your troubles different."},
  {id:397,text:"All of us have made decisions we regret and all of us can be forgiven and start over."},
  {id:398,text:"It is not your weakness that matters to God but your willingness to get out of it."},
  {id:399,text:"The unsaved can cry out for a thousand years but if there is no mediator, there is no hope for them. Jesus is our Mediator. He is the sinner's only Savior."},
  {id:400,text:"God's kind of success has no biological attachment; it springs from Heaven."},
  {id:401,text:"People with vision act at God's time."},
  {id:402,text:"When you lack vision, you lack patience."},
  {id:403,text:"The reason why we cannot endure insult or embarrassment is because we have alternatives."},
  {id:404,text:"The strong are determined to do whatever possible and proper thing it takes to get their goal."},
  {id:405,text:"Idle words can entertain men but cannot reach God."},
  {id:406,text:"Words have the capacity to make and unmake."},
  {id:407,text:"Your words can either build people up or pull them down."},
  {id:408,text:"Vain and idle talk is a product of a vain and idle heart; they are unprofitable and not pleasing to God Almighty."},
  {id:409,text:"With your words you constantly paint a public picture of your inner self."},
  {id:410,text:"Prayer is an acknowledgement that there is a superior realm that controls the physical and invisible world."},
  {id:411,text:"Faith is not a panic button pushed only when in trouble; it is a lifestyle of trusting God, in both good and hard times."},
  {id:412,text:"Unpleasant situations discipline us and improve our Christian character, thus making us better disciples in Christ."},
  {id:413,text:"Because of the lures and cares of the world, fleshly desires and the attraction of the world – pleasure has turned the heart of many from their Creator."},
  {id:414,text:"Take care of the depth of your relationship with God and He will take care of the breadth of your success."},
  {id:415,text:"No one can say “No” to sin without the help of the Holy Spirit."},
  {id:416,text:"The glory of the world is the most charming temptation to the carnally minded."},
  {id:417,text:"Temptation is the presentation of evil; it is an opportunity to choose temporary pleasure rather than permanent gain."},
  {id:418,text:"If you go out of your duty, you forfeit the promise of victory and put yourself out of God's protection."},
  {id:419,text:"For you to enjoy the proceeds of victory, you must be spiritually inclined."},
  {id:420,text:"The uncertainty of the hour of Christ's return calls for vigilance and watchfulness."},
  {id:421,text:"The Bible makes us understand that troubles are to teach us to be consistent and persistent in prayer."},
  {id:422,text:"Prayer is a salve for every sore, a remedy for every malady."},
  {id:423,text:"When we are afflicted with a thorn in our flesh, we should give ourselves to prayer."},
  {id:424,text:"If an answer is not given to the first prayer nor the second, we must hold on until we receive an answer."},
  {id:425,text:"Whatever situation you are in now as a Christian may be to prepare you for a new level or to strengthen your desire for God."},
  {id:426,text:"Trusting God does not consist in praying alone. There are times to pray in faith and times to act in faith."},
  {id:427,text:"Life does not just happen to us. It is all about choices and how we respond to every situation."},
  {id:428,text:"No matter your past, life never completely closes the door to opportunity."},
  {id:429,text:"God's opinion imparts a strength to endure the situation you are in."},
  {id:430,text:"Your situation becomes easier to handle when you know it will not last long."},
  {id:431,text:"When you are not relevant, nobody will bother about you."},
  {id:432,text:"As we try to overcome our trouble, we are making history – history that people and children yet unborn will read about."},
  {id:433,text:"When you begin to speak against your neighbour, you are fighting the wrong battle."},
  {id:434,text:"We are to battle the spiritual entities that cause crisis and tension in our businesses, spiritual life, homes and marriages."},
  {id:435,text:"Do not go and fight your neighbour but pray to deliver your neighbour."},
  {id:436,text:"If we are strong spiritually, our love becomes protection against the hatred of the adversary."},
  {id:437,text:"When you go the way of the Cross, you will begin to see every trial and persecution as a blessing because afflictions are meant for our spiritual benefit."},
  {id:438,text:"A man can be a Christian in profession and yet not such in heart."},
  {id:439,text:"If we resist the devil by an active, lively faith in Christ, satan will flee from us."},
  {id:440,text:"If we think to resist satan by using the name of Christ as a charm, satan will prevail against us."},
  {id:441,text:"When we fight the wrong battle, we will continue to fight an unlimited battle."},
  {id:442,text:"It is never proper to base faith on your improvement after prayer."},
  {id:443,text:"If you must serve God with truth and faith, you should not allow your condition to mislead you."},
  {id:444,text:"Outward affliction, wants and burdens are the great arguments satan uses to make people of God question their sonship."},
  {id:445,text:"There is no reason for faith as good as God's Word."},
  {id:446,text:"It honours God to believe Him even when every sense contradicts Him."},
  {id:447,text:"Temptation can come in any form; they are not from God but from the adversary."},
  {id:448,text:"A man of faith does things out of peace of mind, not for money, not for popularity, not for fame."},
  {id:449,text:"Many have changed the history of their lives because of impatience and over-ambition."},
  {id:450,text:"A man of faith does what he loves, not what others around him are doing."},
  {id:451,text:"After you have struggled, laboured and worked hard as a man of faith, God will still have to mark it. If the result is good, give glory to God; if it is the opposite, submit your ways to Him because in every situation God is still saying something."},
  {id:452,text:"It is not the year that makes us new; we make the year new by the way we live it."},
  {id:453,text:"If we keep our resolutions, we feel fulfilled at the end of the year."},
  {id:454,text:"If we fail to keep our resolutions, we look forward to a new beginning in the incoming year."},
  {id:455,text:"Stop looking at where you are coming from and start looking at where you are going."},
  {id:456,text:"Prayer to the Holy Spirit: “Act in me, O Holy Spirit, that I may keep my resolutions! Strengthen me, O Holy Spirit, to defend all that I promise! Guide me, O Holy Spirit, that I may do what is right in Your sight.”"},
  {id:457,text:"If we were to solve the problem of a New Year using the approach of the old year, we would not make any difference."},
  {id:458,text:"If you do not have a degree in poverty, your degree in blessing is questionable."},
  {id:459,text:"Anytime you face uncommon challenges, do not lose heart. They prepare you for uncommon blessings."},
  {id:460,text:"In the midst of setback people need hope – Jesus is the hope!"},
  {id:461,text:"Fear changes our focus."},
  {id:462,text:"Fear weakens our determination and willpower."},
  {id:463,text:"When we cannot see beyond our immediate situation, we begin to panic."},
  {id:464,text:"One thing is for the eyes of the body to open; another is for the eyes of faith to open."},
  {id:465,text:"When you bother about a problem while neglecting its cause, you cannot have a lasting solution."},
  {id:466,text:"Dealing with the problem while neglecting the cause is like cutting the branches of a tree while leaving the root."},
  {id:467,text:"When your sins are forgiven, you are healed indeed because that is the root of the affliction."},
  {id:468,text:"If you don't know the purpose of life, you may be overwhelmed by circumstances and take actions that destroy relationships beyond repair."},
  {id:469,text:"It takes a reflective mind to discover that beyond your situation lies the promise of God for your life."},
  {id:470,text:"Acting faith makes those things that are against us be for us."},
  {id:471,text:"Focusing on Christ Jesus in the midst of trials puts everything else in perspective."},
  {id:472,text:"Those who have a clear purpose in life always find room in their hearts to bless the name of the Lord, even when He takes away."},
  {id:473,text:"Spiritual damage requires spiritual repair."},
  {id:474,text:"Nursing bitterness, unforgiveness, anger and pain of the past damages your heart."},
  {id:475,text:"Anytime you nurse a grudge, you indirectly give satan permission to strike your life."},
  {id:476,text:"The dividend of forgiveness is freedom."},
  {id:477,text:"Whatever situation you may find yourself in, do not doubt your faith; doubt your doubts because they are unreliable."},
  {id:478,text:"Anytime you begin to feel sorry for yourself for what you don't have, consider all you do have and thank God."},
  {id:479,text:"Doubt is not to overcome us but to sharpen our minds and strengthen our relationship with God."},
  {id:480,text:"Our big problems will not seem so impossible if we let God answer our questions in His own schedule, not ours."},
  {id:481,text:"The best remedy for doubt is to reflect on God's track record in your life."},
  {id:482,text:"God does not need our sacrifice to take away sin but rather that we come to repentance."},
  {id:483,text:"Repentance is not only feeling sorrow for sins committed but also breaking away from sin."},
  {id:484,text:"Repentance is the only hope of receiving God's mercy."},
  {id:485,text:"Our failure to admit our wrong prevents our harmony with God and creates an invisible barrier between us and Him."},
  {id:486,text:"The greatest love Jesus Christ has given us is the opportunity to correct our mistakes."},
  {id:487,text:"The unrenewed mind wages war between faith and doubt – confessing the Word with the mouth while denying it in action."},
  {id:488,text:"Knowing God is not only seeing His works but learning His ways."},
  {id:489,text:"Jesus Christ does not mind doubt as long as you are seeking the answer from Him in the midst of that doubt."},
  {id:490,text:"Your hands may be full of money and your brain full of information, but if your heart is empty, your life is very empty."},
  {id:491,text:"In the university of God, however brilliant you may be, you will not be given double promotion. You must take every course because each course serves a purpose."},
  {id:492,text:"Jesus is all the world to me, my life, my Joy, my all. He is my strength from day to day. Without Him I would fall."},
  {id:493,text:"Worrying about tomorrow cripples our ability to think, act and exercise faith in the present. The present is the only time that is truly ours."},
  {id:494,text:"Your success and happiness depend on your willingness to help others solve their problems."},
  {id:495,text:"Every day, God has something to say to you. Even when He seems to be quiet, God is still saying something."},
  {id:496,text:"A man’s life is what he thinks about all day long."},
  {id:497,text:"The main thing about Christianity is not the work we do but the relationship we maintain and the atmosphere produced by that relationship."},
  {id:498,text:"What you do in secret is what will answer you in the open. There is no shortcut to spiritual maturity. We are made spiritual by living in the Word and by the Word living in us."},
  {id:499,text:"Only your character can testify to the genuineness of your confession of Christ."},
  {id:500,text:"It is not all up to God, and it is certainly not all up to us; It takes God's ability and our willingness to bring about salvation."},
  {id:501,text:"There is a constant war between the flesh and the spirit as long as we are in this world. A war is raging in your heart between faith and doubt, humility and pride, hope and despair, peace and anger, patience and impatience, knowledge and ignorance, self control and greed."},
  {id:502,text:"When times are stable and the sea is calm and secure, no one is really tested."},
  {id:503,text:"Everything big starts little, if something starts big, it calls for concern."},
  {id:504,text:"It is better to live poorly upon the fruits of God's goodness than to live plentifully upon the products of our own sin."},
  {id:505,text:"To learn how to hear God after prayer is a much greater blessing than what you are looking for."},
  {id:506,text:"If you can't trsut God with medicine, you can't trust God without medicine."},
  {id:507,text:"When a vision is from God, there will be a strong desire to make it happen. Even if you cannot see how, you will achieve it. No matter the obstacles on the way to your destination, you will always find ways of building bridges which close the gap from where you are now to your destination."},
  {id:508,text:"While we are on the go, we need to stop between steps, to refocus on the Word and the will of God."},
  {id:509,text:"Avoid the trap of looking back unless it is to glorify God for what He has done."},
  {id:510,text:"Don't misinterprete God's Silence as rejection."},
  {id:511,text:"As a Christian, when your trial is getting hotter, you are getting closer to your breakthrough! Keep pressing!."},
  {id:512,text:"Whatever I am today is a product of that conviction that victory through Christ is victory indeed. The rest is history."},
  {id:513,text:"Many store the bible in their Shelves, the best store it in their hearts."},
  {id:514,text:"Life is too short to waste time on things that have no lasting significance."},
  {id:515,text:"Jesus wants to express Himself and carry out His mission of love to others through you."},
  {id:516,text:"If God has called you, the more they block your way, the more that trouble and temptation, the more God's love is provoked. Each attempt to stop you asks for more evidence from God."},
  {id:517,text:"What can separate us from the love of God? An attempt to separate us by death simply releases us from the imprisonment of this world."},
  {id:518,text:"A look of faith knows what God says about a situation - and what God says is final."},
  {id:519,text:"If we make mistakes, as we all do - don't run from God, run to Him."},
  {id:520,text:"As Christians, we say what God has said over and over until the thing promised in His Word and desired in our hearts is fully manifested in our lives."},
  {id:521,text:"As we live in the Spirit, we live in the process of God's mind."},
  {id:522,text:"The purpose of life is to glorify God in both good and hard times alike."},
  {id:523,text:"When you are wired to God in a unique way, nothing can separate you from the love of God."},
  {id:524,text:"Don't doubt your faith; doubt your doubts for they are unreliable."},
  {id:525,text:"God will never allow a challenge that will surmount us; we are always greater than our challenges."},
  {id:526,text:"There are powers that cause men to be bowed down in bondage and do things opposed to their will. These demons cause men to lose control and commit all kinds of shameful acts."},
  {id:527,text:"A break in faith is a break in prayer, and a break in prayer is a break with God."},
  {id:528,text:"The reward of our relationship with Jesus is power."},
  {id:529,text:"God will withhold the phenomena of signs and wonders in the church until Word and Spirit come together."},
  {id:530,text:"The words you speak should be in line with future you desire, not the future you fear."},
  {id:531,text:"As long as you fast to your confession of fear, doubt, sickness and wory, you will still have them."},
  {id:532,text:"When the words you speak are not in line with God's word, it becomes idle, meaningless and oftentimes destructive."},
  {id:533,text:"The most costly sacrifices of wicked people without a thorough reformation of heart and life caanot be acceptable to God."},
  {id:534,text:"Faith does not deny the existence of the problem. No!. Faith simply focuses on the problem solver, Jesus Christ and not the problem."},
  {id:535,text:"Obeying God's word at the beginning seems hard until we realize that all he is asking for is for our own good, to make life full and free."},
  {id:536,text:"The slow movement of a tiger is not a mistake but a calculated accuracy."},
  {id:537,text:"Men of purpose do not concentrate on where they are now, their focus, aim and desire is on their destination."},
  {id:538,text:"Those whom Christ designs to admit to the most intimate acquaintance with Him (that is close co-worker, to work with Him), He first makes sensible (humble, down-to-earth) to appreciate how undeserving of His grace they ordinarily are."},
  {id:539,text:"When the grace of God comes upon us, it will put an end to our labor and personal struggle."},
  {id:540,text:"A man of purpose focuses on his destination, not his situation. Don't let your situation mislead you!"},
  {id:541,text:"If you have not tasted poverty, you will not be able to manage blessing when it comes. If you have not tasted humiliation, you will not be able to manage honour when it comes."},
  {id:542,text:"You will begin to succeed with your life when the pains and problems of others matter to you."},
  {id:543,text:"Each day has its own destiny. Yesterday is history, today is opportunity while tomorrow is mystery."},
  {id:544,text:"Every Word of God is Spirit and life. When you receive and obey the Word of God, the power of God works in you."},
  {id:545,text:"There is no one ugly, deep, dark, powerful or evil enough to stop God from loving you. Nothing anyone can ever do to you can sever your connection to God. Nothing you could ever do can dam the unstoppable love of God for you. His love for you is undeniable, unrelenting and unconditional. You may ignore God, ridicule Him and reject Him but His love for you will remain constant and unchanging."},
  {id:546,text:"No matter how fast a lie runs, the truth will someday overtake it."},
  {id:547,text:"Faith does not ask for possible things; it demands impossible."},
  {id:548,text:"Be patient. Let God answer your question on His schedule, not yours."},
  {id:549,text:"See your weakness as a reason to pray the more, it should not be the reason for sadness or to abandon your post."},
  {id:550,text:"God's Word refreshes our mind and God's Spirit renews our strength."},
  {id:551,text:"I have never seen where hatred overcomes love. When you love, you overcome. Love is the most powerful weapon."},
  {id:552,text:"Read the Bible for the salvation of your soul, not the solution to your problem."},
  {id:553,text:"Hard times may test me, they cannot destroy me."},
  {id:554,text:"Sit and reflect on life itself and you would discover that nothing happens by chance."},
  {id:555,text:"When the Spirit of God comes into us, He wants to be Himself in us. He wants His energy to be poured through us. He wants His wisdom to be deposited in our hearts. He wants His instinct and nature to be evident and obvious in you. He wants us to see what He is looking at, to feel what He feels, to know what He knows, to work with His projects, see life the way He sees it, get His ideas and know His opinion about yourself and others."},
  {id:556,text:"No trouble, no matter how great the trouble is, should prevent you from praying."},
  {id:557,text:"Better is not good enough; the best is yet to come!"},
  {id:558,text:"Jesus Christ said, 'I pray your faith will not fail.' This means your faith will be tested. What is testing your faith right now?"},
  {id:559,text:"God is Spirit – without the Holy Spirit you cannot relate to Him."},
  {id:560,text:"Love looks around to see who is in need."},
  {id:561,text:"Never doubt God's desire or ability to help you."},
  {id:562,text:"You are because I am and I am because you are. We are one another's strength."},
  {id:563,text:"The way of obedience is the way of blessing."},
  {id:564,text:"Education is not success, but it helps us to succeed."},
  {id:565,text:"The Lord has given an overcoming victory to every person who is born again."},
  {id:566,text:"God speaks to us, through His Word by His Spirit."},
  {id:567,text:"Put on the new man by renewing your mind with God's Word and submitting your body to the authority of that Word."},
  {id:568,text:"The age of miracles has not passed. The Miracle Worker is still ALIVE. His name is Jesus Christ!"},
  {id:569,text:"God alone can deliver us from a life of meaningless activities."},
  {id:570,text:"Your mind must be at its best for God before it becomes His dwelling place."},
  {id:571,text:"Those who overcome satan will be required to use the power of the spoken Word."},
  {id:572,text:"Your troubles may point you to death and destruction, but God's Word points you to life."},
  {id:573,text:"There is never a sickness Jesus cannot heal and never a disease Jesus cannot cure. To God's power, nothing is impossible!"},
  {id:574,text:"As we struggle to overcome our troubles, we are making history and fulfilling our destiny. Keep pressing!"},
  {id:575,text:"You are who you are by virtue of the company you keep."},
  {id:576,text:"If gold must be gold, it must pass through the furnace."},
  {id:577,text:"If you turn to God once, He will turn to you a million times."},
  {id:578,text:"Let us learn to dream again. To learn to dream again is to have big plans. To learn to dream again is to readjust, to look to God."},
  {id:579,text:"For everything that happens to a Christian, God is aware."},
  {id:580,text:"We only have victory over satan when we walk in the Spirit in Christ Jesus."},
  {id:581,text:"Don't murmur and rebel in your hour of adversity. Trust in God in every trial."},
  {id:582,text:"If you can believe, worry and anxiety will vanish."},
  {id:583,text:"Jesus never consults your past to determine your present."},
  {id:584,text:"When satan wants you to cry and you laugh, you defeat him."},
  {id:585,text:"The power that flows from His name, the name Jesus, will be in proportion to our love for His Word."},
  {id:586,text:"Your weakness can be turned to strength for God's glory."},
  {id:587,text:"You must love your neighbor as yourself. Your neighbor may not share the same faith with you but love first."},
  {id:588,text:"Knowing facts about God does not change our relationship with Him. Our relationship with Him can only change us when we have taken God's Word to heart and truly made it part of us."},
  {id:589,text:"Faith is of man's heart. Whatever does not come from your heart is a sin."},
  {id:590,text:"Holding offense is like committing crime because unforgiveness imprisons us."},
  {id:591,text:"Let us remember our future. What you are doing now will be credited to your future."},
  {id:592,text:"God often uses anything to prepare you, stop you for a while to rearrange your future."},
  {id:593,text:"There can be no loving without giving. So, as sons and daughter of love, let us always endeavor to reach out to those in need around us."},
  {id:594,text:"The manner you help, forgive and restore another person is the same manner, you will be helped, forgiven and restored."},
  {id:595,text:"Match your action with your word."},
  {id:596,text:"The Word of God helps us to stop reliving the past in our present life. That means, the past will no longer control your thinking pattern or behaviors. That is when you know you are free."},
  {id:597,text:"Deliverance attracts enemies, persecution. The moment you are delivered, your enemies increase for the success you are looking for is honey to the enemy. They are there to strengthen your desire and determination for God."},
  {id:598,text:"Your past is forgotten. Never think of those things that lie behind but look forward to what lies ahead."},
  {id:599,text:"Be tired of reliving the past in your present life."},
  {id:600,text:"Whatever situation you are facing, don't let it overwhelm you. Stay focused because there is something far more important than that situation – your dream and your goals in life."},
  {id:601,text:"Love has a language that transcends all languages, all barriers and all distance."},
  {id:602,text:"You need not fear where you are going when you know Jesus is going with you."},
  {id:603,text:"Someone out there is waiting for you for a lifetime. You cannot afford to fail them; failing them is failing God."},
  {id:604,text:"I cannot define failure because I don't believe in failure. There is no failure in my book."},
  {id:605,text:"Judge not, so that you will not be judged. We should talk to people to be saved and not to die."},
  {id:606,text:"Every day you must stay true to your purpose, despite snow or rain. When your purpose is clear, your life will have meaning."},
  {id:607,text:"Whether you are young or old, what matters is the grace to continue living hereafter."},
  {id:608,text:"It is what you believe that translates in the life you live."},
  {id:609,text:"When you see someone who is great without God's character, don't admire him – pray for him."},
  {id:610,text:"When you are connected to your destiny, nothing and nothing can stop you."},
  {id:611,text:"Miracles, signs, wonders, deliverance and healing cannot be exchanged with money."},
  {id:612,text:"The man that is poor is not the one who has no money but one without a dream."},
  {id:613,text:"Character is the one that carries whatever we become. If your wealth is bigger than your character, that wealth will be spending you."},
  {id:614,text:"What you make happen for others, God makes happen for you."},
  {id:615,text:"Pastors are sent to utter the deep things of God for the conviction of sin, and for edification and comfort."},
  {id:616,text:"Those who created yesterday's pain cannot control tomorrow's potential."},
  {id:617,text:"We should not allow unhealthy ego, pride or greed to overrule our good intention."},
  {id:618,text:"If you believe in what you are doing, why should disappointment separate you from it?"},
  {id:619,text:"Nobody is too good or too bad to qualify for God's grace."},
  {id:620,text:"If you are prepared to die, you are prepared to live."},
  {id:621,text:"We should let love be uppermost in our hearts because all our doings without love are nothing."},
  {id:622,text:"Many times, God speaks blessing and breakthrough through pain and disappointment."},
  {id:623,text:"When we inherit stolen wealth in a will, we would live under a stolen future."},
  {id:624,text:"The way and manner God executes His plan in our lives differs."},
  {id:625,text:"If you are with God in truth and faith, whatever comes as a blessing or trial will be what God allows."},
  {id:626,text:"When God calls a man or woman, what they will eat, what they will use and everything they need will be provided abundantly by God."},
  {id:627,text:"When you learn what God has made you for and how He treasures your company, you are bound to be contented."},
  {id:628,text:"I feel strong in challenges, believing that personal improvement and fulfillment come through the continual process of learning."},
  {id:629,text:"When the root of your wrong is not from the heart, your wrong will make you to run to God the more."},
  {id:630,text:"If your actions are motivated by selfish interests rather than God, you are mortgaging tomorrow's joy."},
  {id:631,text:"In a situation where you become so great without God's character, it means the end is going to be bad."},
  {id:632,text:"If you run before God, you cannot run after God."},
  {id:633,text:"Of all graces, faith honours Christ the most; of all graces, Christ honours faith the most."},
  {id:634,text:"That you are regularly facing challenges does not make you an unbeliever."},
  {id:635,text:"Discovery is for forward lookers."},
  {id:636,text:"You have been allowing challenges to destroy you instead of you to destroy challenges."},
  {id:637,text:"Blessing without good health is a crisis because you cannot enjoy it."},
  {id:638,text:"It is praiseworthy when you give not only to your power but beyond your power."},
  {id:639,text:"God is building Himself in to us, making Himself part of us as the Word rules, dominates and sanctifies our spirit nature."},
  {id:640,text:"Your greatest mistakes will happen because of impatience."},
  {id:641,text:"Don't wait for a more convenient day to discipline your mind!"},
  {id:642,text:"When the POWER OF GOD is present, healing and deliverance are just like BREATHING!"},
  {id:643,text:"One thing is clear - demons know they must submit to the superior authority in the name of Jesus Christ!"},
  {id:644,text:"Trouble comes not because we have taken any wrong step but because we are in a complex and contradictory world."},
  {id:645,text:"Heal me, oh Lord, I will be healed. Save me, oh Lord, I will be saved. Bless me, oh Lord, I will be blessed. Free me, oh Lord, I will be free."},
  {id:646,text:"If you decide on your direction, God will give you the energy for the distance."},
  {id:647,text:"To the man of faith, there is always a future."},
  {id:648,text:"I was baptized into Christ. I died when He died. Sin's power over me has been broken, in Jesus' name!"},
  {id:649,text:"The peace of the world concerns only body and time but the peace, the joy, that Christ gives enriches the soul for eternity."},
  {id:650,text:"A beautiful life does not just happen; it is built."},
  {id:651,text:"Pardoning mercy makes way for healing mercy."},
  {id:652,text:"Everyone makes mistakes - mistakes are correctable."},
  {id:653,text:"Be sure that those in whom you trust are led by God each day."},
  {id:654,text:"You are responsible for what you give your attention to."},
  {id:655,text:"You must embrace the Word of God as the most effective instrument for change."},
  {id:656,text:"Your prayers, effort and fasting for many years are not lost. This is the time you have been praying for. Breakthrough!"},
  {id:657,text:"If you are in a hurry to get money, you will be in a hurry to spend it. Anything that starts dubiously will surely end dubiously."},
  {id:658,text:"A joyful congregation is an attractive congregation."},
  {id:659,text:"Nothing will carry you through hardship like a sincere devotion to Christ."},
  {id:660,text:"If we make God our heart's delight, we shall have our heart's desire."},
  {id:661,text:"Where there is unconditional love, the wound of one is the wound of all."},
  {id:662,text:"There is no one and there will never be anyone like you."},
  {id:663,text:"The first step in our walk of faith is to stop our own works and rest in God's love, wisdom and power."},
  {id:664,text:"The blessing of God enriches the soul for eternity while that given by the world enriches the body temporarily."},
  {id:665,text:"When your situation has gone beyond the power of nature, it has become a curse. Who can remove a curse but Jesus Christ?"},
  {id:666,text:"Faith is a channel through which the anointing flows."},
  {id:667,text:"Christ has no place in the life that is not dominated by the Word."},
  {id:668,text:"Your confession must absolutely agree with the Word of God!"},
  {id:669,text:"When discouragement comes, don't stop. Dig deep and fight it through!"},
  {id:670,text:"Relax in the precious arms of the Holy Spirit."},
  {id:671,text:"In mercy, God has called you and saved, healed, blessed and delivered you."},
  {id:672,text:"Trials are the soil in which faith flourishes."},
  {id:673,text:"In order not to end up like the masses out there who are merely wandering and unsure of their goals and dreams, your objective must be clear. When your purpose is clear, your life will have meaning."},
  {id:674,text:"Anytime you don't trade your joy for your situation, you will overcome because that situation wants to see you looking sad."},
  {id:675,text:"Don't trade the future for anything. Suffer now and enjoy tomorrow."},
  {id:676,text:"If you handle your hard times with care, they will soon become good times."},
  {id:677,text:"Oftentimes God works through adverse circumstances of life for the purpose of cleansing us and separating us from impure elements such as anger, bitterness and unforgiveness."},
  {id:678,text:"When your enemy attacks you and you remain silent, it creates fear in your enemies because they don't know your position and they don't know what your silence means."},
  {id:679,text:"When you respond to your enemies, it gives them the next strategy to use."},
  {id:680,text:"The key to succeed in life, as a child of God: any time you face difficulty, quickly remember the times of difficult trials you faced in the past — this will impart strength to face the present difficulty you have now."},
  {id:681,text:"Challenges, temptations and situations are informants that promotion is coming."},
  {id:682,text:"Your enemy loses no time to plot against you; you should lose no time to commit yourself to the Lord in prayer."},
  {id:683,text:"There is power in my mouth, the belief in my heart is released by faith out of my mouth."},
  {id:684,text:"If we take God's word to heart and truly make it a part of you by meditation, it will by it very nature change you and when it does, you will soon be called to act with God"},
];
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function hl(t,q){if(!q)return esc(t);const e=esc(t),s=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return e.replace(new RegExp('('+s+')','gi'),'<mark>$1</mark>')}
function render(list,q){
  const ql=document.getElementById('ql'),nr=document.getElementById('nr'),vc=document.getElementById('vc'),rb=document.getElementById('rb');
  if(!list.length){ql.innerHTML='';nr.style.display='block';vc.textContent='0';rb.textContent=q?'No results for "'+q+'"':'';return}
  nr.style.display='none';vc.textContent=list.length;
  rb.textContent=q?list.length+' result'+(list.length!==1?'s':'')+' for "'+q+'"':'';
  ql.innerHTML=list.map(x=>`<div class="qi" id="q${x.id}" data-id="${x.id}">
    <div class="qn">#${x.id}</div>
    <div class="qt">${hl(x.text,q)}</div>
    <div class="qa">
      <button onclick="cp(${x.id})" id="cb${x.id}">Copy</button>
      <button onclick="cl(${x.id})">Link</button>
    </div>
  </div>`).join('')
}
function cp(id){
  const x=Q.find(q=>q.id===id);if(!x)return;
  navigator.clipboard.writeText('"'+x.text+'" — TB Joshua (#'+id+')').then(()=>{
    const b=document.getElementById('cb'+id);
    if(b){b.textContent='Copied!';b.classList.add('ok')}
    toast('Quote copied');
    setTimeout(()=>{if(b){b.textContent='Copy';b.classList.remove('ok')}},2000);
  });
}
function cl(id){
  const url=location.origin+location.pathname+'#q'+id;
  navigator.clipboard.writeText(url).then(()=>toast('Link to #'+id+' copied'));
}
function toast(m){
  const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function goTo(){
  const v=parseInt(document.getElementById('gi').value);
  if(!v||v<1||v>684)return toast('Enter 1–684');
  const si=document.getElementById('si');
  if(si.value){si.value='';render(Q,'');}
  requestAnimationFrame(()=>{
    const el=document.getElementById('q'+v);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2000);}
  });
}
let tmr;
document.getElementById('si').addEventListener('input',e=>{
  clearTimeout(tmr);
  tmr=setTimeout(()=>{
    const q=e.target.value.trim();
    if(!q){render(Q,'');return}
    const words=q.toLowerCase().split(/\s+/);
    render(Q.filter(x=>words.every(w=>x.text.toLowerCase().includes(w))),q);
  },120);
});
document.getElementById('gi').addEventListener('keydown',e=>{if(e.key==='Enter')goTo()});
function handleHash(){
  const h=location.hash;
  if(h&&h.startsWith('#q')){
    const id=parseInt(h.slice(2));
    if(id>=1&&id<=684){
      setTimeout(()=>{
        const el=document.getElementById('q'+id);
        if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2000);}
      },300);
    }
  }
}
render(Q,'');
handleHash();
</script>
